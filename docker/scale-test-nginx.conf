worker_processes 1;
events { worker_connections 1024; }

http {
  # Deliberately default round-robin, no sticky sessions (ip_hash / cookie
  # affinity) -- this mirrors Fly.io's documented default behavior for a
  # new connection landing on any machine of the app, which is exactly the
  # scenario being tested: does Beacon behave correctly with NO session
  # affinity across independent app processes, not with affinity enabled.
  upstream beacon_pool {
    server app:3838;
    server app2:3838;
    server app3:3838;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://beacon_pool;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 300s;
    }
  }
}
